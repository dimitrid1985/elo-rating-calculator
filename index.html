<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Xadrez - Classificação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Classificação Geral</h2>
    
    <div class="card">
        <table id="tabelaRanking">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Nome</th>
                    <th>Rating</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="3" style="text-align: center;">Carregando ranking...</td>
                </tr>
            </tbody>
        </table>

        <!-- Botão para a área de administração -->
        <a href="registro.html" style="text-decoration: none;">
            <button type="button" style="margin-top: 20px; background-color: var(--primary-color);">Registrar Partidas</button>
        </a>
        <a href="novo_jogador.html" style="text-decoration: none;">
            <button type="button" style="margin-top: 20px; background-color: var(--primary-color);">Incluir jogador</button>
        </a>
        <a href="historico.html" style="text-decoration: none;">
            <button type="button" style="margin-top: 20px; background-color: var(--primary-color);">Histórico de partidas</button>
        </a>
    </div>

    <script src="ranking.js"></script>
</body>
</html>
