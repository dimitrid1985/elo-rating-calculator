<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Partidas - Xadrez</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!-- Substitua pelo caminho do seu arquivo CSS, se houver -->
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Ranking</a>
        <a href="registro.html">Registrar Partida</a>
        <a href="historico.html">Histórico de Partidas</a>
    </nav>

    <h2>Histórico Recente</h2>
    
    <!-- ... (seu menu <nav> e título <h2> continuam aqui) ... -->

    <!-- ADICIONE O CAMPO DE FILTRO AQUI 👇 -->
    <div style="margin-bottom: 15px;">
        <input type="text" id="inputFiltro" onkeyup="filtrarPorJogador()" placeholder="Buscar por nome do jogador..." style="padding: 8px; width: 100%; max-width: 300px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <table>
        <thead>
            <tr>
                <th>Data e Hora</th>
                <th>Brancas</th>
                <th>Pretas</th>
            </tr>
        </thead>
        <tbody id="tabelaHistorico">
            <!-- As linhas da tabela serão injetadas aqui pelo JavaScript -->
            <tr>
                <td colspan="4" style="text-align: center;">Carregando histórico...</td>
            </tr>
        </tbody>
    </table>

    <div id="containerGrafico" style="display: none; margin-top: 40px; width: 100%; max-width: 800px;">
        <h3 style="text-align: center;">Evolução de Rating: <span id="nomeJogadorGrafico"></span></h3>
        <canvas id="graficoEvolucao"></canvas>
    </div>

    <script src="script.js"></script>
    <script>
        // Dispara a busca dos dados assim que a página for carregada
        window.onload = carregarHistorico;
    </script>
</body>
</html>
